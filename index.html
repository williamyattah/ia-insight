<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>IA Insight – Veille IA pour les directions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f7f6f3;--card:#fff;--tx:#1c1b19;--mu:#6b6860;--ac:#2f4cdd;--bd:#e4e1da}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1e2026;--tx:#eceae4;--mu:#9a978f;--ac:#7f95ff;--bd:#2d3038}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
header,main{max-width:1100px;margin:auto;padding:20px}h1{margin:0;font-size:26px}h1 span{color:var(--ac)}
.sub,.meta{color:var(--mu)}.sub{margin:4px 0 0}input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:16px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card h3{margin:8px 0;font-size:16px}.card a{color:inherit;text-decoration:none}.card a:hover{color:var(--ac)}
.meta{font-size:12px;display:flex;gap:8px;flex-wrap:wrap}.tag{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px}
</style></head><body>
<header><h1>IA <span>Insight</span></h1><p class="sub" id="up">Veille quotidienne sur les solutions d'IA, par métier et par secteur.</p></header>
<main><input id="q" placeholder="Rechercher…">
<h2>Métiers</h2><div class="chips" id="fm"></div><h2>Secteurs</h2><div class="chips" id="fs"></div>
<div class="grid" id="g"></div></main>
<script>
let D={articles:[],metiers:[],secteurs:[]},f={m:null,s:null};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chips(id,arr,k){const e=document.getElementById(id);e.innerHTML="";["Tous",...arr].forEach(v=>{const b=document.createElement("button");b.textContent=v;if((f[k]||"Tous")===v)b.className="on";b.onclick=()=>{f[k]=v==="Tous"?null:v;render()};e.appendChild(b)})}
function render(){chips("fm",D.metiers,"m");chips("fs",D.secteurs,"s");const q=document.getElementById("q").value.toLowerCase();
const r=D.articles.filter(a=>(!f.m||a.m.includes(f.m))&&(!f.s||a.s.includes(f.s))&&a.t.toLowerCase().includes(q));
document.getElementById("g").innerHTML=r.map(a=>`<div class="card"><div class="meta">${[...a.m,...a.s].map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><h3><a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.t)}</a></h3><div class="meta">${esc(a.o)} · ${new Date(a.ts*1000).toLocaleDateString("fr-FR")}</div></div>`).join("")||"<p>Aucun article.</p>"}
document.getElementById("q").oninput=render;
fetch("articles.json").then(r=>r.json()).then(j=>{D=j;document.getElementById("up").textContent="Mis à jour le "+new Date(j.updated).toLocaleString("fr-FR");render()}).catch(()=>render());
</script></body></html>
